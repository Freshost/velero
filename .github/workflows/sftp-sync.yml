name: SFTP Sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: freshost/velero
  SFTP_COMMIT: b1fe737012c158586dc675ab533213fc85c48551

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: freshost
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch tags
        run: |
          git remote add upstream https://github.com/vmware-tanzu/velero.git
          git fetch upstream --tags --force

      - name: Find new tags
        id: find-tags
        run: |
          ALL_TAGS=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          LATEST_MINORS=$(echo "$ALL_TAGS" | sed -E 's/\.[0-9]+$//' | sort -V | uniq | tail -2)
          echo "Tracking: $LATEST_MINORS"
          NEW_TAGS=""
          for MINOR in $LATEST_MINORS; do
            for TAG in $(echo "$ALL_TAGS" | grep "^${MINOR}\."); do
              if ! git tag -l "${TAG}-sftp" | grep -q .; then
                NEW_TAGS="${NEW_TAGS} ${TAG}"
              fi
            done
          done
          NEW_TAGS=$(echo "$NEW_TAGS" | xargs)
          echo "new_tags=${NEW_TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags to process: ${NEW_TAGS:-none}"

      - name: Apply SFTP patch
        if: steps.find-tags.outputs.new_tags != ''
        id: patch
        run: |
          set +e
          BUILT_TAGS=""
          FAILED_TAGS=""
          SFTP_FILES=$(git diff-tree --no-commit-id --name-only -r "$SFTP_COMMIT" | grep -v '^go\.\(mod\|sum\)$')
          for TAG in ${{ steps.find-tags.outputs.new_tags }}; do
            SFTP_TAG="${TAG}-sftp"
            echo "::group::${TAG} -> ${SFTP_TAG}"
            git checkout -f "${TAG}"
            git clean -fd
            OK=true
            for FILE in $SFTP_FILES; do
              mkdir -p "$(dirname "$FILE")"
              git show "${SFTP_COMMIT}:${FILE}" > "${FILE}" 2>/dev/null || { OK=false; break; }
              git add "${FILE}"
            done
            if [ "$OK" = true ]; then
              go get github.com/pkg/sftp
              go mod tidy
              git add go.mod go.sum
              git commit -m "Add SFTP backend for ${TAG}"
              git tag "${SFTP_TAG}"
              git push origin "${SFTP_TAG}"
              BUILT_TAGS="${BUILT_TAGS} ${SFTP_TAG}"
            else
              git reset --hard HEAD
              FAILED_TAGS="${FAILED_TAGS} ${TAG}"
            fi
            echo "::endgroup::"
          done
          echo "built_tags=$(echo $BUILT_TAGS | xargs)" >> "$GITHUB_OUTPUT"
          echo "failed_tags=$(echo $FAILED_TAGS | xargs)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.patch.outputs.built_tags != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.patch.outputs.built_tags != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        if: steps.patch.outputs.built_tags != ''
        run: |
          for SFTP_TAG in ${{ steps.patch.outputs.built_tags }}; do
            echo "::group::Building ${SFTP_TAG}"
            git checkout "${SFTP_TAG}"
            docker buildx build \
              --platform linux/amd64 \
              --push \
              --tag "${REGISTRY}/${IMAGE_NAME}:${SFTP_TAG}" \
              --build-arg BIN=velero \
              --build-arg PKG=github.com/vmware-tanzu/velero \
              --build-arg "VERSION=${SFTP_TAG}" \
              --build-arg "GIT_SHA=$(git rev-parse HEAD)" \
              --build-arg GIT_TREE_STATE=clean \
              --build-arg "REGISTRY=${REGISTRY}/freshost" \
              --build-arg RESTIC_VERSION=0.15.0 \
              .
            echo "::endgroup::"
          done

      - name: Open issue on failure
        if: steps.patch.outputs.failed_tags != ''
        uses: actions/github-script@v7
        with:
          script: |
            const failed = '${{ steps.patch.outputs.failed_tags }}'.trim();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'SFTP patch failed for: ' + failed,
              body: 'Failed to apply SFTP patch to: ' + failed,
              labels: ['automation'],
            });

      - name: Summary
        if: always()
        run: |
          echo "## Sync Results" >> "$GITHUB_STEP_SUMMARY"
          echo "Built: ${{ steps.patch.outputs.built_tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Failed: ${{ steps.patch.outputs.failed_tags }}" >> "$GITHUB_STEP_SUMMARY"
